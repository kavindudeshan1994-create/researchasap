name: Cache ACS Nano article images
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate ACS Nano article images
        run: python scripts/refresh_figures.py
      - name: Commit images and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/figures.json images/articles/
          if ! git diff --cached --quiet; then
            git commit -m "Cache verified ACS Nano article images"
            git pull --rebase origin main
          git push origin HEAD:main
          fi
